name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Signing is skipped: CI has no certificate, and none is needed to
      # compile and run the tests.
      - name: Test
        run: |
          xcodebuild test \
            -project paster.xcodeproj \
            -scheme paster \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
